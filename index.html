<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLITAST GAME</title>
    <meta name="description" content="個人開発のさまざまなゲーム" />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="canonical" href="https://blitast-studio.github.io/blitast-game/" />
    <meta property="og:title" content="BLITAST GAME" />
    <meta property="og:description" content="個人開発のさまざまなゲーム" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blitast-studio.github.io/blitast-game/" />
    <meta property="og:image" content="https://blitast-studio.github.io/blitast-game/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BLITAST GAME" />
    <meta name="twitter:description" content="個人開発のさまざまなゲーム" />
    <meta name="twitter:image" content="https://blitast-studio.github.io/blitast-game/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="studio-field" aria-hidden="true">
      <div class="void-light"></div>
      <div class="void-ground"></div>
      <canvas class="field" aria-hidden="true"></canvas>
    </div>
    <header class="void-bar">
      <a class="void-mark" href="./">BLITAST GAME</a>
      <nav aria-label="外部リンク">
        <a id="link-x" href="https://x.com/blitast_studio" target="_blank" rel="noopener noreferrer">@blitast_studio</a>
        <a id="link-itch" href="https://blitastxyz.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
        <a id="link-github" href="https://github.com/BLITAST-STUDIO" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </header>
    <section class="void">
      <h1 class="sr-only" id="sr-tagline">個人開発のさまざまなゲーム</h1>
      <div class="hero-copy">
        <p class="tategaki" aria-hidden="true">個人開発のさまざまなゲーム</p>
        <p class="hero-mark">
          <span class="logo" tabindex="0">
            <span class="logo-core">
              <span class="logo-line">BLITAST</span>
              <span class="logo-line">STUDIO</span>
            </span>
          </span>
        </p>
      </div>
      <p class="void-caption" aria-hidden="true">VOID</p>
      <p class="scroll-hint" aria-hidden="true"><span>Scroll</span></p>
    </section>
    <section class="exhibit" aria-labelledby="lib-heading">
      <header class="lib-head">
        <div>
          <p class="kicker" id="lib-heading">Library</p>
          <p class="lib-lead">いま遊べるゲーム</p>
        </div>
        <p class="lib-count" id="lib-count">04</p>
      </header>
      <a class="lib-featured" id="featured-link" href="https://blitastxyz.itch.io/buttered-cat-flappy-paradox" target="_blank" rel="noopener noreferrer">
        <div class="frame">
          <img id="featured-cover" src="games/buttered-cat.jpg" alt="Buttered Cat Flappy Paradox — バタートーストを背負って飛ぶオレンジの猫" width="1600" height="1200" />
          <span class="lib-play" aria-hidden="true">PLAY</span>
        </div>
        <div class="meta">
          <p class="lib-genre" id="featured-genre">Arcade</p>
          <h2 id="featured-title">Buttered Cat Flappy Paradox</h2>
          <p class="blurb" id="featured-blurb">背中にバタートーストを乗せた猫。クリックかスペースで飛び、どこまで生き残れるか。</p>
          <span class="seal"><span class="seal-dot" aria-hidden="true"></span>itch.io で遊ぶ</span>
        </div>
      </a>
      <ul class="lib-grid" id="lib-grid"></ul>
      <p class="all-games">
        <a id="all-games" href="https://blitastxyz.itch.io/" target="_blank" rel="noopener noreferrer">itch.io のスタジオページ <span aria-hidden="true">↗</span></a>
      </p>
    </section>
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee-track"></div></div>

    <div class="bgm-dock" id="bgm-dock">
      <audio id="bgm-audio" src="audio/bgm.mp3" loop preload="metadata" playsinline></audio>
      <button type="button" class="bgm-toggle" id="bgm-toggle" aria-pressed="false" aria-label="BGMを再生">
        <span class="bgm-icon" aria-hidden="true">♪</span>
      </button>
      <label class="bgm-vol-wrap" for="bgm-vol">
        <span class="sr-only">音量</span>
        <input type="range" id="bgm-vol" class="bgm-vol" min="0" max="1" step="0.01" value="0.32" />
      </label>
    </div>

    <script src="featured.js"></script>
    <script src="field.js"></script>
    <script>
      (function () {
        var data = window.BLITAST;
        if (!data) return;
        var s = data.studio;
        var games = data.games || [];
        var featured = games.filter(function (g) { return g.featured; })[0] || games[0] || {};
        var rest = games.filter(function (g) { return g !== featured; });
        var setText = function (id, t) { var el = document.getElementById(id); if (el && t) el.textContent = t; };
        var setHref = function (id, h) { var el = document.getElementById(id); if (el && h) el.setAttribute("href", h); };
        var esc = function (t) { return String(t || "").replace(/[&<>"]/g, function (c) { return ({'&':'&','<':'<','>':'>','"':'"'}[c]); }); };
        setText("sr-tagline", s.tagline);
        setText("link-x", s.xHandle); setHref("link-x", s.x);
        setHref("link-itch", s.itch); setHref("link-github", s.github); setHref("all-games", s.itch);
        setText("lib-count", String(games.length).padStart(2, "0"));
        setText("featured-title", featured.title);
        setText("featured-blurb", featured.blurb);
        setText("featured-genre", featured.genre);
        setHref("featured-link", featured.url);
        var img = document.getElementById("featured-cover");
        if (img) { img.src = featured.cover; img.alt = featured.coverAlt || featured.title || ""; }
        var tategaki = document.querySelector(".tategaki");
        if (tategaki && s.tagline) tategaki.textContent = s.tagline;
        var grid = document.getElementById("lib-grid");
        if (grid) {
          grid.innerHTML = rest.map(function (g) {
            return '<li><a class="lib-card" href="'+esc(g.url)+'" target="_blank" rel="noopener noreferrer">'
              + '<div class="frame"><img src="'+esc(g.cover)+'" alt="'+esc(g.coverAlt || g.title)+'" width="1600" height="1200" />'
              + '<span class="lib-play" aria-hidden="true">PLAY</span></div>'
              + '<div class="lib-meta"><p class="lib-genre">'+esc(g.genre)+'</p><h3>'+esc(g.title)+'</h3><p>'+esc(g.blurb)+'</p></div>'
              + '</a></li>';
          }).join("");
        }
        var track = document.getElementById("marquee-track");
        if (track) {
          var titles = games.map(function (g) { return g.title; });
          var items = [s.tagline].concat(titles).concat(["PLAY", s.name, "itch.io"]);
          track.innerHTML = items.concat(items).map(function (item) {
            return item === "PLAY" ? "<span data-mark>PLAY</span>" : "<span>" + esc(item) + "</span>";
          }).join("");
        }
      })();
    </script>
    <script>
      (function () {
        var audio = document.getElementById("bgm-audio");
        var toggle = document.getElementById("bgm-toggle");
        var vol = document.getElementById("bgm-vol");
        if (!audio || !toggle || !vol) return;

        var KEY_ON = "blitast-bgm-on";
        var KEY_VOL = "blitast-bgm-vol";
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function setPlaying(on) {
          toggle.setAttribute("aria-pressed", on ? "true" : "false");
          toggle.setAttribute("aria-label", on ? "BGMを停止" : "BGMを再生");
          toggle.classList.toggle("is-on", on);
        }

        try {
          var savedVol = localStorage.getItem(KEY_VOL);
          if (savedVol != null) vol.value = savedVol;
        } catch (e) {}
        audio.volume = Number(vol.value);

        vol.addEventListener("input", function () {
          audio.volume = Number(vol.value);
          try { localStorage.setItem(KEY_VOL, vol.value); } catch (e) {}
        });

        toggle.addEventListener("click", function () {
          if (audio.paused) {
            audio.play().then(function () {
              setPlaying(true);
              try { localStorage.setItem(KEY_ON, "1"); } catch (e) {}
            }).catch(function () {
              setPlaying(false);
            });
          } else {
            audio.pause();
            setPlaying(false);
            try { localStorage.setItem(KEY_ON, "0"); } catch (e) {}
          }
        });

        audio.addEventListener("ended", function () {
          setPlaying(!audio.paused);
        });

        if (!reduce) {
          try {
            if (localStorage.getItem(KEY_ON) === "1") {
              audio.play().then(function () { setPlaying(true); }).catch(function () {
                setPlaying(false);
              });
            }
          } catch (e) {}
        }
      })();
    </script>


    <script>
      (function () {
        var el = document.querySelector(".logo");
        if (!el) return;
        var hover = false;
        var p = 0;
        var prev = performance.now();
        function tick(now) {
          var dt = Math.min(0.05, (now - prev) / 1000);
          prev = now;
          var target = hover ? 1 : 0;
          var k = 1 - Math.exp(-dt / (hover ? 0.38 : 0.48));
          p += (target - p) * k;
          if (Math.abs(target - p) < 0.001) p = target;
          el.style.setProperty("--logo-p", p.toFixed(4));
          requestAnimationFrame(tick);
        }
        el.addEventListener("pointerenter", function () { hover = true; });
        el.addEventListener("pointerleave", function () { hover = false; });
        el.addEventListener("focus", function () { hover = true; });
        el.addEventListener("blur", function () { hover = false; });
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
