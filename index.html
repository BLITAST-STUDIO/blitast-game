<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLITAST GAME</title>
    <meta name="description" content="個人が作る、すぐ遊べる小さなゲームたち" />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="canonical" href="https://okamotoryolee.github.io/blitast-game/" />
    <meta property="og:title" content="BLITAST GAME" />
    <meta property="og:description" content="個人が作る、すぐ遊べる小さなゲームたち" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://okamotoryolee.github.io/blitast-game/" />
    <meta property="og:image" content="https://okamotoryolee.github.io/blitast-game/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BLITAST GAME" />
    <meta name="twitter:description" content="個人が作る、すぐ遊べる小さなゲームたち" />
    <meta name="twitter:image" content="https://okamotoryolee.github.io/blitast-game/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="studio-field" aria-hidden="true">
      <div class="void-light"></div>
      <div class="void-ground"></div>
      <canvas class="field" aria-hidden="true"></canvas>
    </div>
    <header class="void-bar">
      <a class="void-mark" href="./">BLITAST GAME</a>
      <nav aria-label="外部リンク">
        <a id="link-x" href="https://x.com/blitast_studio" target="_blank" rel="noopener noreferrer">@blitast_studio</a>
        <a id="link-itch" href="https://blitastxyz.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
        <a id="link-github" href="https://github.com/okamotoryolee" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </header>
    <section class="void">
      <h1 class="sr-only" id="sr-tagline">個人が作る、すぐ遊べる小さなゲームたち</h1>
      <p class="tategaki" aria-hidden="true">個人が作る、すぐ遊べる小さなゲームたち</p>
      <p class="void-caption" aria-hidden="true">FIELD</p>
      <p class="scroll-hint" aria-hidden="true"><span>Scroll</span></p>
    </section>
    <section class="exhibit">
      <p class="kicker">Featured</p>
      <a class="featured" id="featured-link" href="https://blitastxyz.itch.io/buttered-cat-flappy-paradox" target="_blank" rel="noopener noreferrer">
        <div class="frame">
          <img id="featured-cover" src="games/buttered-cat.jpg" alt="Buttered Cat Flappy Paradox — バタートーストを背負って飛ぶオレンジの猫" width="1600" height="1200" />
        </div>
        <div class="meta">
          <h2 id="featured-title">Buttered Cat Flappy Paradox</h2>
          <p class="blurb" id="featured-blurb">背中にバタートーストを乗せた猫。クリックかスペースで飛び、どこまで生き残れるか。</p>
          <span class="seal"><span class="seal-dot" aria-hidden="true"></span>itch.io で遊ぶ</span>
        </div>
      </a>
      <div class="also" id="also-wrap" hidden>
        <p class="kicker kicker-also">Also</p>
        <ul id="also-list"></ul>
      </div>
      <p class="all-games">
        <a id="all-games" href="https://blitastxyz.itch.io/" target="_blank" rel="noopener noreferrer">すべてのゲーム <span aria-hidden="true">↗</span></a>
      </p>
    </section>
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee-track"></div></div>
    <script src="featured.js"></script>
    <script src="field.js"></script>
    <script>
      (function () {
        var data = window.BLITAST;
        if (!data) return;
        var s = data.studio, f = data.featured;
        var setText = function (id, t) { var el = document.getElementById(id); if (el && t) el.textContent = t; };
        var setHref = function (id, h) { var el = document.getElementById(id); if (el && h) el.setAttribute("href", h); };
        setText("sr-tagline", s.tagline);
        setText("link-x", s.xHandle); setHref("link-x", s.x);
        setHref("link-itch", s.itch); setHref("link-github", s.github); setHref("all-games", s.itch);
        setText("featured-title", f.title); setText("featured-blurb", f.blurb); setHref("featured-link", f.url);
        var img = document.getElementById("featured-cover");
        if (img) { img.src = f.cover; img.alt = f.coverAlt || f.title; }
        var tategaki = document.querySelector(".tategaki");
        if (tategaki && s.tagline) tategaki.textContent = s.tagline;
        var alsoWrap = document.getElementById("also-wrap");
        var alsoList = document.getElementById("also-list");
        var also = data.also || [];
        if (alsoWrap && alsoList && also.length) {
          alsoWrap.hidden = false;
          alsoList.innerHTML = also.map(function (g) {
            var title = g.title || "";
            var url = g.url || "#";
            var blurb = g.blurb || "";
            var cover = g.cover || "";
            var alt = g.coverAlt || title;
            return '<li><a class="also-card" href="'+url+'" target="_blank" rel="noopener noreferrer">'
              + '<div class="frame"><img src="'+cover+'" alt="'+alt+'" width="1600" height="1200" /></div>'
              + '<div class="also-meta"><h3>'+title+'</h3><p>'+blurb+'</p></div>'
              + '</a></li>';
          }).join("");
        }
        var track = document.getElementById("marquee-track");
        if (track) {
          var alsoTitles = also.map(function (g) { return g.title; });
          var items = [s.tagline, f.title].concat(alsoTitles).concat(["PLAY", s.name, "itch.io"]);
          track.innerHTML = items.concat(items).map(function (item) {
            return item === "PLAY" ? "<span data-mark>PLAY</span>" : "<span>" + item + "</span>";
          }).join("");
        }
      })();
    </script>
  </body>
</html>
